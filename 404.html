<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Jhon Valencia Santana</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/PortafolioCreativoJhonValencia/assets/img/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #E8E8E4; --fg: #151515; --accent: #E44832; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: "Space Grotesk", Arial, sans-serif; display: grid; place-items: center; padding: 24px; }
    main { position: relative; text-align: center; }
    .bar { position: absolute; left: 50%; top: -6vh; width: clamp(60px, 10vw, 160px); height: 50vh; background: var(--accent); transform: translateX(-50%); z-index: -1; }
    h1 { margin: 0; font-size: clamp(120px, 30vw, 420px); line-height: .8; letter-spacing: -.07em; }
    p { font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .08em; margin: 28px 0; }
    a { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .08em; color: var(--fg); border: 1px solid var(--fg); padding: 12px 18px; border-radius: 999px; text-decoration: none; }
    a:hover { background: var(--fg); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <span class="bar" aria-hidden="true"></span>
    <h1>404</h1>
    <p>ESTA CARTA NO ESTÁ EN LA BARAJA.</p>
    <a href="/PortafolioCreativoJhonValencia/">← VOLVER AL PORTAFOLIO</a>
  </main>
</body>
</html>
